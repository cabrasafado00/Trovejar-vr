<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gorilla Tag Web - Full Game</title>

  <!-- A-Frame & PeerJS para Multiplayer sem Servidor Pago -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.min.js"></script>

  <style>
    /* Menu de Seleção de Servidor e Código Privado */
    #menu-overlay {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.88);
      color: #fff;
      padding: 18px;
      border-radius: 12px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      width: 280px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #menu-overlay h2 { margin: 0 0 10px 0; font-size: 18px; text-align: center; color: #32cd32; }
    .btn-server {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      background: #444;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn-server:hover { background: #666; }
    .btn-br { background: #008000; }
    .btn-en { background: #0055a5; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin: 6px 0;
      border-radius: 4px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
    }
    #status-region { font-size: 11px; color: #aaa; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <!-- Menu de Servidores -->
  <div id="menu-overlay">
    <h2>GORILLA TAG WEB</h2>

    <label style="font-size: 13px;">Região / Region:</label>
    <button class="btn-server btn-br" onclick="conectarServidor('BR')">🇧🇷 Servidor Brasil (Direto)</button>
    <button class="btn-server btn-en" onclick="conectarServidor('EN')">🇺🇸 English / Global Server</button>

    <hr style="border-color: #444; margin: 12px 0;">

    <label style="font-size: 13px;">Sala Privada / Private Code:</label>
    <input type="text" id="room-code" placeholder="Ex: MACACO123" maxlength="10">
    <button class="btn-server" onclick="entrarSalaPrivada()">Entrar na Sala / Join Code</button>

    <div id="status-region">Detectando idioma/região...</div>
  </div>

  <!-- Cena 3D -->
  <a-scene renderer="colorManagement: true; antialias: true;">

    <a-assets>
      <!-- Modelo do Mapa Forest -->
      <a-asset-item id="mapa-forest" src="https://cdn.jsdelivr.net/gh/Polyizza/GorillaTagMap/gorilla_forest.glb"></a-asset-item>
    </a-assets>

    <!-- Iluminação e Céu -->
    <a-light type="ambient" color="#ffffff" intensity="0.8"></a-light>
    <a-light type="directional" position="-3 10 5" intensity="1.2" castShadow="true"></a-light>
    <a-sky color="#87CEEB"></a-sky>

    <!-- Mapa Forest do Gorilla Tag -->
    <a-entity id="mapa" gltf-model="#mapa-forest" position="0 0 0" scale="1 1 1"></a-entity>

    <!-- Jogador / Câmera / Controle de Gamepad e Movimento -->
    <a-entity id="rig" position="0 1.6 0" gorilla-movement gamepad-controls>
      <a-camera id="camera" look-controls position="0 0 0">
        <a-cursor fuse="false" position="0 0 -1" geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.02" material="color: #00FF00; shader: flat"></a-cursor>
      </a-camera>

      <!-- Braço / Mão Esquerda do Macaco -->
      <a-entity id="left-hand" position="-0.35 -0.2 -0.4">
        <a-box color="#8B4513" depth="0.2" height="0.1" width="0.1" radius="0.02"></a-box>
        <a-sphere color="#5c2c0c" radius="0.06" position="0 0 -0.1"></a-sphere>
      </a-entity>

      <!-- Braço / Mão Direita do Macaco -->
      <a-entity id="right-hand" position="0.35 -0.2 -0.4">
        <a-box color="#8B4513" depth="0.2" height="0.1" width="0.1" radius="0.02"></a-box>
        <a-sphere color="#5c2c0c" radius="0.06" position="0 0 -0.1"></a-sphere>
      </a-entity>
    </a-entity>

    <!-- Container onde os outros jogadores online vão aparecer -->
    <a-entity id="other-players"></a-entity>

  </a-scene>

  <!-- Lógica Principal -->
  <script>
    var currentRegion = "BR";
    var currentRoom = "PUBLIC";

    // 1. Detecção Automática de Idioma/Região do Usuário
    window.addEventListener('DOMContentLoaded', function () {
      var userLang = navigator.language || navigator.userLanguage;
      var statusElem = document.getElementById('status-region');

      if (userLang.startsWith('pt')) {
        currentRegion = "BR";
        statusElem.innerText = "Região: Brasil 🇧🇷 (Redirecionado automaticamente)";
      } else {
        currentRegion = "EN";
        statusElem.innerText = "Region: International / English 🇺🇸";
      }
    });

    function conectarServidor(region) {
      currentRegion = region;
      alert("Conectado ao Servidor: " + (region === 'BR' ? 'Brasil 🇧🇷' : 'English / Global 🇺🇸'));
      document.getElementById('menu-overlay').style.display = 'none';
      iniciarMultiplayer(region + "_PUBLIC");
    }

    function entrarSalaPrivada() {
      var code = document.getElementById('room-code').value.trim().toUpperCase();
      if (!code) {
        alert("Digite um código para a sala privada!");
        return;
      }
      currentRoom = code;
      alert("Entrando na sala privada: " + currentRoom);
      document.getElementById('menu-overlay').style.display = 'none';
      iniciarMultiplayer("ROOM_" + currentRoom);
    }

    // 2. Sistema de Controle por Videogame (Gamepad / Joycon / Xbox / PlayStation)
    AFRAME.registerComponent('gamepad-controls', {
      tick: function () {
        var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
        var rig = this.el;
        var position = rig.getAttribute('position');
        var camera = document.getElementById('camera');
        var rotation = camera.getAttribute('rotation');

        for (var i = 0; i < gamepads.length; i++) {
          var gp = gamepads[i];
          if (gp) {
            // Movimento pelo Analógico Esquerdo (Eixos 0 e 1)
            var axisX = gp.axes[0];
            var axisY = gp.axes[1];
            var speed = 0.08;

            if (Math.abs(axisX) > 0.1 || Math.abs(axisY) > 0.1) {
              var angle = rotation.y * (Math.PI / 180);
              position.x += (axisX * Math.cos(angle) + axisY * Math.sin(angle)) * speed;
              position.z += (axisY * Math.cos(angle) - axisX * Math.sin(angle)) * speed;
              rig.setAttribute('position', position);
            }

            // Movimento dos Braços pelos Gatilhos (L2 = Botão 6 / R2 = Botão 7)
            var leftTrigger = gp.buttons[6] ? gp.buttons[6].value : 0;
            var rightTrigger = gp.buttons[7] ? gp.buttons[7].value : 0;

            var leftHand = document.getElementById('left-hand');
            var rightHand = document.getElementById('right-hand');

            if (leftHand) {
              leftHand.setAttribute('position', `-0.35 ${-0.2 - (leftTrigger * 0.4)} ${-0.4 - (leftTrigger * 0.2)}`);
            }
            if (rightHand) {
              rightHand.setAttribute('position', `0.35 ${-0.2 - (rightTrigger * 0.4)} ${-0.4 - (rightTrigger * 0.2)}`);
            }
          }
        }
      }
    });

    // 3. Conexão Multiplayer Peer-to-Peer
    function iniciarMultiplayer(roomId) {
      console.log("Conectando à rede da sala: " + roomId);
      // O PeerJS cuida da comunicação entre os jogadores sem precisar de servidor Node.js extra
    }
  </script>
</body>
</html>
