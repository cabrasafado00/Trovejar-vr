<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Gorilla Tag VR - Original Forest Map</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>
</head>
<body>

  <a-scene shadow="type: pcfsoft" renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true;">
    
    <!-- ILUMINAÇÃO E AMBIENTE FLORESTA (G-TAG STYLE) -->
    <a-entity id="meu-ambiente" 
              environment="preset: forest; lighting: distant; shadow: true; shadowSize: 20; dressing: trees; dressingAmount: 25; skyType: atmosphere; skyColor: #3a86ff; groundColor: #2d5a27; groundColor2: #1e3d1a;">
    </a-entity>

    <!-- PAREDES DE ROCHA EM REDOR DO MAPA (ROCHAS LOW-POLY) -->
    <a-cylinder position="0 5 -5" radius="18" height="12" open-ended="true" material="color: #4a4e69; side: double; roughness: 0.9" shadow></a-cylinder>

    <!-- ÁRVORE OCA CENTRAL (TREEHOUSE) -->
    <a-entity id="treehouse" position="0 0 -6">
      <!-- Tronco Principal Oco -->
      <a-cylinder position="0 4 0" radius="2.8" height="8" open-ended="true" material="color: #4a2c11; side: double; roughness: 0.9" shadow></a-cylinder>
      <!-- Copa da Árvore -->
      <a-dodecahedron position="0 9 0" radius="5.5" material="color: #2b702d; roughness: 0.8" shadow></a-dodecahedron>
      
      <!-- Entrada da Árvore -->
      <a-box position="0 1.5 2.6" width="2" height="3" depth="0.5" material="color: #1a0f05"></a-box>
    </a-entity>

    <!-- INTERIOR DA ÁRVORE: COMPUTADOR / QUADRO DE DENÚNCIAS -->
    <a-entity id="computador-gtag" position="0 1.6 -4.8">
      <!-- Mesa/Suporte -->
      <a-box position="0 -0.4 0" width="1.8" height="0.8" depth="0.8" color="#2b2d42" shadow></a-box>
      <!-- Monitor -->
      <a-box position="0 0.3 0" width="1.6" height="0.9" depth="0.1" color="#111" shadow></a-box>
      <!-- Ecrã com Controles -->
      <a-plane position="0 0.3 0.06" width="1.5" height="0.8" color="#001219">
        <a-text value="GORILLA SYSTEM - VR" align="center" position="0 0.3 0.01" scale="0.35 0.35 0.35" color="#00f5d4"></a-text>
        
        <!-- Botões de Tempo (Dia / Tarde / Noite) -->
        <a-box class="botao-interativo" munda-tempo="preset: forest" position="-0.5 0 0.02" width="0.4" height="0.2" depth="0.04" color="#ffee32">
          <a-text value="DIA" align="center" position="0 0 0.03" scale="0.25 0.25 0.25" color="#000"></a-text>
        </a-box>

        <a-box class="botao-interativo" munda-tempo="preset: sunset" position="0 0 0.02" width="0.4" height="0.2" depth="0.04" color="#fb5607">
          <a-text value="TARDE" align="center" position="0 0 0.03" scale="0.25 0.25 0.25" color="#fff"></a-text>
        </a-box>

        <a-box class="botao-interativo" munda-tempo="preset: starry" position="0.5 0 0.02" width="0.4" height="0.2" depth="0.04" color="#3a0ca3">
          <a-text value="NOITE" align="center" position="0 0 0.03" scale="0.25 0.25 0.25" color="#fff"></a-text>
        </a-box>

        <!-- Botão Denúncia -->
        <a-box class="botao-interativo" denúncia-acao position="0 -0.25 0.02" width="1.2" height="0.18" depth="0.04" color="#ff0054">
          <a-text id="texto-denuncia" value="[ REPORT PLAYER ]" align="center" position="0 0 0.03" scale="0.22 0.22 0.22" color="#fff"></a-text>
        </a-box>
      </a-plane>
    </a-entity>

    <!-- PLATAFORMAS DE MADEIRA E PONTE SUSPENSA -->
    <!-- Plataforma Alta 1 -->
    <a-box position="-3.5 3.5 -5" width="2.5" height="0.2" depth="2.5" color="#6c584c" shadow></a-box>
    <!-- Plataforma Alta 2 -->
    <a-box position="3.5 3.5 -5" width="2.5" height="0.2" depth="2.5" color="#6c584c" shadow></a-box>
    
    <!-- Ponte de Madeira ligando as plataformas -->
    <a-box position="0 3.5 -5" width="4.5" height="0.1" depth="1" color="#8d7966" shadow></a-box>

    <!-- BOTOES VIRTUAIS DE MOVIMENTO (6DOF) -->
    <!-- Botão Agachar / Levantar -->
    <a-cylinder controle-altura position="-1 0.2 -2" radius="0.25" height="0.1" color="#4361ee">
      <a-text value="AGACHAR" align="center" rotation="-90 0 0" position="0 0.06 0" scale="0.25 0.25 0.25"></a-text>
    </a-cylinder>

    <!-- CÂMERA E CONTROLES 6DOF -->
    <a-entity id="rig" position="0 1.6 -1" simula-6dof>
      <a-camera look-controls position="0 0 0">
        <a-cursor fuse="true" 
                  fuse-timeout="1200" 
                  position="0 0 -1" 
                  geometry="primitive: ring; radiusInner: 0.015; radiusOuter: 0.025" 
                  material="color: #00FF00; shader: flat">
        </a-cursor>
      </a-camera>
    </a-entity>

  </a-scene>

  <!-- LÓGICA DO JOGO -->
  <script>
    // Troca de horário no mapa
    AFRAME.registerComponent('munda-tempo', {
      schema: { preset: {type: 'string'} },
      init: function () {
        var data = this.data;
        this.el.addEventListener('click', function () {
          var env = document.querySelector('#meu-ambiente');
          env.setAttribute('environment', 'preset', data.preset);
        });
      }
    });

    // Botão de Denúncia
    AFRAME.registerComponent('denúncia-acao', {
      init: function () {
        this.el.addEventListener('click', function () {
          var txt = document.querySelector('#texto-denuncia');
          txt.setAttribute('value', 'REPORT SENT!');
          setTimeout(function() {
            txt.setAttribute('value', '[ REPORT PLAYER ]');
          }, 2000);
        });
      }
    });

    // Alternar Agachar / Levantar
    var agachado = false;
    AFRAME.registerComponent('controle-altura', {
      init: function () {
        this.el.addEventListener('click', function () {
          var rig = document.querySelector('#rig');
          var pos = rig.getAttribute('position');
          pos.y = agachado ? 1.6 : 0.8;
          agachado = !agachado;
          rig.setAttribute('position', pos);
        });
      }
    });

    // Movimentação 6DoF
    AFRAME.registerComponent('simula-6dof', {
      tick: function () {
        var camera = this.el.querySelector('a-camera');
        if (!camera) return;
        
        var rotation = camera.getAttribute('rotation');
        var position = this.el.getAttribute('position');
        var speed = 0.05;

        // Caminhar para a frente (Olhar para baixo)
        if (rotation.x < -12 && rotation.x > -50) {
          var dir = new THREE.Vector3();
          camera.object3D.getWorldDirection(dir);
          dir.y = 0;
          dir.normalize();
          position.x -= dir.x * speed;
          position.z -= dir.z * speed;
          this.el.setAttribute('position', position);
        }

        // Recuar / Andar para trás (Olhar para cima)
        if (rotation.x > 35) {
          var dir = new THREE.Vector3();
          camera.object3D.getWorldDirection(dir);
          dir.y = 0;
          dir.normalize();
          position.x += dir.x * (speed * 0.7);
          position.z += dir.z * (speed * 0.7);
          this.el.setAttribute('position', position);
        }
      }
    });
  </script>
</body>
</html>
